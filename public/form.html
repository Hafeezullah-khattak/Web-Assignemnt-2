<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add / Edit Item | Lost & Found Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav id="navbar"></nav>

  <main>
    <h2 id="form-heading">Add New Item</h2>

    <div id="form-message"></div>

    <form id="item-form">
      <label for="type">Type</label>
      <select name="type" id="type" required>
        <option value="Lost">Lost</option>
        <option value="Found">Found</option>
      </select>

      <label for="name">Item Name</label>
      <input type="text" name="name" id="name" placeholder="e.g. Black Wallet" required />

      <label for="category">Category</label>
      <input type="text" name="category" id="category" placeholder="e.g. Wallet, Laptop, Keys" required />

      <label for="location">Location</label>
      <input type="text" name="location" id="location" placeholder="e.g. Central Library" required />

      <label for="date">Date</label>
      <input type="date" name="date" id="date" required />

      <label for="description">Description</label>
      <textarea name="description" id="description" rows="3" placeholder="Brief description of the item"></textarea>

      <label for="status">Status</label>
      <select name="status" id="status" required>
        <option value="Reported">Reported</option>
        <option value="Searching">Searching</option>
        <option value="Found">Found</option>
        <option value="Claim Pending">Claim Pending</option>
        <option value="Returned">Returned</option>
      </select>

      <button type="submit" class="btn btn-primary">Save Item</button>
    </form>
  </main>

  <footer id="footer"></footer>

  <script src="js/app.js"></script>
  <script src="js/form.js"></script>
</body>
</html>
